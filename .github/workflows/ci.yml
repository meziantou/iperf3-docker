on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 10 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build image
        run: docker build --tag ghcr.io/meziantou/iperf3:1.0.${{github.run_number}} --tag ghcr.io/meziantou/iperf3:latest --file Dockerfile .
        
      - name: push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/meziantou/iperf3:1.0.${{github.run_number}}
          docker push ghcr.io/meziantou/iperf3:latest
